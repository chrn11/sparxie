name: Build Native iOS IPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd native-ios
          xcodegen generate

      - name: Build Rust staticlib
        run: cargo build --release --target aarch64-apple-ios --manifest-path core/Cargo.toml

      - name: Verify FFI symbols
        run: |
          nm -gU core/target/aarch64-apple-ios/release/libsparxie.a | grep -q "sparxie_" || {
            echo "ERROR: No sparxie_* symbols found"
            exit 1
          }

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project native-ios/Sparxie.xcodeproj \
            -scheme Sparxie \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=0000000000

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios/derivedData -name "Sparxie.app" -type d | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/Sparxie.app
          cd build/ios/ipa
          zip -r sparxie-trollstore.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparxie-trollstore
          path: build/ios/ipa/sparxie-trollstore.ipa

  release:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sparxie-trollstore

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: sparxie-trollstore.ipa