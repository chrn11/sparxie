[package]
name = "sparxie"
version = "0.1.0"
edition = "2024"

[lib]
name = "sparxie"
path = "src/lib.rs"
crate-type = ["staticlib"]

# Release profile is tuned for binary size — the staticlib ships inside an
# iOS app bundle, so a few extra build minutes on CI are well worth a
# ~40% smaller native library.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
redb = "2"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5"
