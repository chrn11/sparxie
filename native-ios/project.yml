name: Sparxie
options:
  bundleIdPrefix: com.sparxie
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    ONLY_ACTIVE_ARCH: true
    DEFINES_MODULE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
  release:
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

targets:
  Sparxie:
    type: application
    platform: iOS
    sources:
      - path: Sparxie
        excludes:
          - "**/.DS_Store"
          - "**/Sparxie.entitlements"
          - "**/Info.plist"
      - path: Sparxie/Sparxie/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparxie.app
        PRODUCT_NAME: Sparxie
        DISPLAY_NAME: Sparxie
        INFOPLIST_FILE: Sparxie/Sparxie/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sparxie/Sparxie/Sparxie.entitlements
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sparxie/Sparxie/Core"
          - "$(SRCROOT)/../core/target/aarch64-apple-ios/release"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../core/target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "-lsparxie"
          - "-lobjc"
          - "-framework"
          - "Security"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "SwiftUI"
          - "-framework"
          - "Combine"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "SPARXIE_IOS=1"
        SWIFT_OBJC_BRIDGING_HEADER: Sparxie/Sparxie/Core/SparxieBridge.h
        ENABLE_BITCODE: NO
    dependencies: []